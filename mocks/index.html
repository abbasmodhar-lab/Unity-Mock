<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Unity Desk</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head><body>
<iframe id="am-session-frame" title="Unity Desk"></iframe>
<script>
(function(){
  var frame = document.getElementById('am-session-frame');
  function sync(){
    var h = (location.hash || '').replace(/^#/, '') || "salary-structure";
    var q = location.search || '';
    frame.src = 'desk.html' + q + '#' + h;
  }
  window.addEventListener('hashchange', sync);
  sync();
})();
</script>
</body></html>
